allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def rootBuildDirectory = rootProject.layout.buildDirectory
rootBuildDirectory.set(file('../build'))
subprojects {
    project.layout.buildDirectory.set(rootBuildDirectory.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootBuildDirectory
}
