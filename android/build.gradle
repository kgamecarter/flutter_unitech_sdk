group = 'tw.kgame.app.plugin.unitech_sdk'
version = '1.0-SNAPSHOT'

buildscript {
    // Flutter host apps supply these plugins when they include this module.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath 'com.android.tools.build:gradle:9.3.1'
            classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def usesLegacyKotlin = agpMajor < 9 || providers.gradleProperty('android.builtInKotlin').orNull == 'false'
if (usesLegacyKotlin) {
    pluginManager.apply('org.jetbrains.kotlin.android')
}

android {
    namespace = 'tw.kgame.app.plugin.unitech_sdk'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    if (usesLegacyKotlin) {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }

    defaultConfig {
        minSdk = 16
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
}
